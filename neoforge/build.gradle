plugins { id 'net.neoforged.moddev' }

base { archivesName = 'bigbangskills-neoforge' }

neoForge {
    version = project.neoforge_version
    runs { server { server(); programArgument '--nogui' } }
    mods { bigbangskills { sourceSet(sourceSets.main) } }
}

dependencies {
    implementation project(':common')
    implementation project(':persistence-sql')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) }
}
