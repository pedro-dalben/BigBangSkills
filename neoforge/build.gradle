plugins { id 'net.neoforged.moddev' }

base { archivesName = 'bigbangskills-neoforge' }

neoForge {
    version = project.neoforge_version
    runs { server { server(); programArgument '--nogui' } }
    mods {
        bigbangskills {
            sourceSet(sourceSets.main)
            sourceSet(project(':api').sourceSets.main)
            sourceSet(project(':common').sourceSets.main)
            sourceSet(project(':persistence-sql').sourceSets.main)
        }
    }
}

dependencies {
    implementation project(':common')
    implementation project(':persistence-sql')

    implementation 'com.zaxxer:HikariCP:6.2.1'
    jarJar(group: 'com.zaxxer', name: 'HikariCP', version: '[6.2.1,7.0.0)')
    additionalRuntimeClasspath 'com.zaxxer:HikariCP:6.2.1'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.0'
    jarJar(group: 'org.xerial', name: 'sqlite-jdbc', version: '[3.46.1.0,3.47.0.0)')
    additionalRuntimeClasspath 'org.xerial:sqlite-jdbc:3.46.1.0'
    implementation 'com.mysql:mysql-connector-j:9.0.0'
    jarJar(group: 'com.mysql', name: 'mysql-connector-j', version: '[9.0.0,10.0.0)')
    additionalRuntimeClasspath 'com.mysql:mysql-connector-j:9.0.0'
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.4.1'
    jarJar(group: 'org.mariadb.jdbc', name: 'mariadb-java-client', version: '[3.4.1,4.0.0)')
    additionalRuntimeClasspath 'org.mariadb.jdbc:mariadb-java-client:3.4.1'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) }
}

tasks.named('jar', Jar) {
    from project(':api').sourceSets.main.output
    from project(':common').sourceSets.main.output
    from project(':persistence-sql').sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
